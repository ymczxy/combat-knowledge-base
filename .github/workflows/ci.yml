name: CKB CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m ckb.cli validate
      - run: PYTHONPATH=src python -m ckb.cli catalog-audit
      - run: PYTHONPATH=src python -m ckb.cli source-audit
      - run: PYTHONPATH=src python -m ckb.cli candidates --output /tmp/ckb-candidates
      - run: test -f /tmp/ckb-candidates/candidates.json && test -f /tmp/ckb-candidates/ambiguities.json && test -f /tmp/ckb-candidates/manifest.json
      - run: PYTHONPATH=src python -m ckb.cli import-csv data/templates/entity_import_template.csv --output /tmp/manual_import.json
      - run: test -f /tmp/manual_import.json
      - run: PYTHONPATH=src python -m ckb.cli build --output exports --profile destory --allow-unverified
      - run: PYTHONPATH=src python -m ckb.cli site --output /tmp/ckb-site-docs
