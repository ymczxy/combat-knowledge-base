name: CKB CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m ckb.cli validate
      - run: PYTHONPATH=src python -m ckb.cli catalog-audit
      - run: PYTHONPATH=src python -m ckb.cli source-audit
      - run: PYTHONPATH=src python -m ckb.cli predicate-audit
      - run: PYTHONPATH=src python -m ckb.cli assertion-audit --output /tmp/assertion-governance.json --fail-on-conflict
      - run: test -f /tmp/assertion-governance.json
      - run: PYTHONPATH=src python -m ckb.cli fact-snapshot --output /tmp/ckb-fact-snapshot.json
      - run: test -f /tmp/ckb-fact-snapshot.json
      - run: PYTHONPATH=src python -m ckb.cli graph --output /tmp/ckb-graph.json
      - run: test -f /tmp/ckb-graph.json
      - run: PYTHONPATH=src python -m ckb.cli stats
      - run: PYTHONPATH=src python -m ckb.content_audit --output /tmp/ckb-content-report.json
      - run: test -f /tmp/ckb-content-report.json
      - run: PYTHONPATH=src python -m ckb.cli candidates --output /tmp/ckb-candidates
      - run: test -f /tmp/ckb-candidates/candidates.json && test -f /tmp/ckb-candidates/ambiguities.json && test -f /tmp/ckb-candidates/manifest.json
      - run: PYTHONPATH=src python -m ckb.cli drafts --output /tmp/ckb-drafts
      - run: test -f /tmp/ckb-drafts/manifest.json && test "$(find /tmp/ckb-drafts -name '*.json' | wc -l)" -gt 500
      - run: PYTHONPATH=src python -m ckb.cli resolve-fixture tests/fixtures/t34_resolution.json --constraints --output /tmp/ckb-resolution
      - run: test -f /tmp/ckb-resolution/decisions.json && test -f /tmp/ckb-resolution/accepted.json && test -f /tmp/ckb-resolution/review_queue.json && test -f /tmp/ckb-resolution/manifest.json
      - run: PYTHONPATH=src python -m ckb.cli batch-resolve-cache --limit 5 --output /tmp/ckb-batch
      - run: test -f /tmp/ckb-batch/manifest.json && test -f /tmp/ckb-batch/missing_cache.json
      - run: PYTHONPATH=src python -m ckb.cli import-csv data/templates/entity_import_template.csv --output /tmp/manual_import.json
      - run: test -f /tmp/manual_import.json
      - run: PYTHONPATH=src python -m ckb.cli build --output exports --profile destory --allow-unverified
      - run: PYTHONPATH=src python -m ckb.cli site --output /tmp/ckb-site-docs
      - run: PYTHONPATH=src python -m ckb.technical --output /tmp/ckb-technical-comparison.json --markdown /tmp/ckb-site-docs/compare/technical.md --fail-on-unsupported
      - run: test -f /tmp/ckb-technical-comparison.json && test -f /tmp/ckb-site-docs/compare/technical.md
      - run: PYTHONPATH=src python -m ckb.technical_metrics --output /tmp/ckb-derived-metrics.json --markdown /tmp/ckb-site-docs/compare/derived-metrics.md --fail-on-error
      - run: test -f /tmp/ckb-derived-metrics.json && test -f /tmp/ckb-site-docs/compare/derived-metrics.md
