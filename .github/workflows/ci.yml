name: CKB CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[docs]"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m ckb.cli validate
      - run: PYTHONPATH=src python -m ckb.cli catalog-audit
      - run: PYTHONPATH=src python -m ckb.cli source-audit
      - run: PYTHONPATH=src python -m ckb.cli predicate-audit
      - run: PYTHONPATH=src python -m ckb.cli assertion-audit --output /tmp/assertion-governance.json --fail-on-conflict
      - run: test -f /tmp/assertion-governance.json
      - run: PYTHONPATH=src python -m ckb.cli fact-snapshot --output /tmp/ckb-fact-snapshot.json
      - run: test -f /tmp/ckb-fact-snapshot.json
      - run: PYTHONPATH=src python -m ckb.cli graph --output /tmp/ckb-graph.json
      - run: test -f /tmp/ckb-graph.json
      - run: PYTHONPATH=src python -m ckb.cli stats
      - run: PYTHONPATH=src python -m ckb.content_audit --output /tmp/ckb-content-report.json
      - run: test -f /tmp/ckb-content-report.json
      - run: PYTHONPATH=src python -m ckb.cli candidates --output /tmp/ckb-candidates
      - run: test -f /tmp/ckb-candidates/candidates.json && test -f /tmp/ckb-candidates/ambiguities.json && test -f /tmp/ckb-candidates/manifest.json
      - run: PYTHONPATH=src python -m ckb.cli drafts --output /tmp/ckb-drafts
      - run: test -f /tmp/ckb-drafts/manifest.json && test "$(find /tmp/ckb-drafts -name '*.json' | wc -l)" -gt 500
      - run: PYTHONPATH=src python -m ckb.cli resolve-fixture tests/fixtures/t34_resolution.json --constraints --output /tmp/ckb-resolution
      - run: test -f /tmp/ckb-resolution/decisions.json && test -f /tmp/ckb-resolution/accepted.json && test -f /tmp/ckb-resolution/review_queue.json && test -f /tmp/ckb-resolution/manifest.json
      - run: PYTHONPATH=src python -m ckb.cli batch-resolve-cache --limit 5 --output /tmp/ckb-batch
      - run: test -f /tmp/ckb-batch/manifest.json && test -f /tmp/ckb-batch/missing_cache.json
      - run: PYTHONPATH=src python -m ckb.cli import-csv data/templates/entity_import_template.csv --output /tmp/manual_import.json
      - run: test -f /tmp/manual_import.json
      - run: PYTHONPATH=src python -m ckb.cli build --output exports --profile destory --allow-unverified
      - run: PYTHONPATH=src python -m ckb.cli site --output /tmp/ckb-site-docs
      - run: PYTHONPATH=src python -m ckb.cli site --output site_docs
      - run: node --check assets/site/javascripts/ckb-explorer.js
      - run: mkdocs build --strict --site-dir /tmp/ckb-built-site
      - run: test -f /tmp/ckb-built-site/explorer/index.html && test -f /tmp/ckb-built-site/query-index.json && test -f /tmp/ckb-built-site/assets/javascripts/ckb-explorer.js
      - run: PYTHONPATH=src python -m ckb.technical --output /tmp/ckb-technical-comparison.json --markdown /tmp/ckb-site-docs/compare/technical.md --fail-on-unsupported
      - run: test -f /tmp/ckb-technical-comparison.json && test -f /tmp/ckb-site-docs/compare/technical.md
      - run: PYTHONPATH=src python -m ckb.technical_metrics --output /tmp/ckb-derived-metrics.json --markdown /tmp/ckb-site-docs/compare/derived-metrics.md --fail-on-error
      - run: test -f /tmp/ckb-derived-metrics.json && test -f /tmp/ckb-site-docs/compare/derived-metrics.md
      - run: PYTHONPATH=src python -m ckb.godot_bundle --profile data/curated/destory/build_profile.json --output /tmp/ckb-godot --fail-on-error
      - run: test -f /tmp/ckb-godot/ckb_destory_runtime.json && test -f /tmp/ckb-godot/ckb-lock.json
      - run: PYTHONPATH=src python -m ckb.runtime_contract --bundle /tmp/ckb-godot/ckb_destory_runtime.json --lock /tmp/ckb-godot/ckb-lock.json --output /tmp/ckb-runtime-contract.json --fail-on-error
      - run: test -f /tmp/ckb-runtime-contract.json && test -f examples/godot/CKBRuntimeBundle.gd
      - run: PYTHONPATH=src python -m ckb.godot_bundle --profile data/curated/destory/small_arms_build_profile.json --output /tmp/ckb-godot-small-arms --fail-on-error
      - run: test -f /tmp/ckb-godot-small-arms/ckb_destory_small_arms_runtime.json && test -f /tmp/ckb-godot-small-arms/ckb-small-arms-lock.json
      - run: PYTHONPATH=src python -m ckb.runtime_contract --bundle /tmp/ckb-godot-small-arms/ckb_destory_small_arms_runtime.json --lock /tmp/ckb-godot-small-arms/ckb-small-arms-lock.json --output /tmp/ckb-small-arms-runtime-contract.json --fail-on-error
      - run: test -f /tmp/ckb-small-arms-runtime-contract.json
      - run: PYTHONPATH=src python -m ckb.godot_bundle --profile data/curated/destory/aviation_build_profile.json --output /tmp/ckb-godot-aviation --fail-on-error
      - run: PYTHONPATH=src python -m ckb.runtime_contract --bundle /tmp/ckb-godot-aviation/ckb_destory_aviation_runtime.json --lock /tmp/ckb-godot-aviation/ckb-aviation-lock.json --output /tmp/ckb-aviation-runtime-contract.json --fail-on-error
      - run: test -f /tmp/ckb-aviation-runtime-contract.json
      - run: PYTHONPATH=src python -m ckb.godot_bundle --profile data/curated/destory/naval_build_profile.json --output /tmp/ckb-godot-naval --fail-on-error
      - run: PYTHONPATH=src python -m ckb.runtime_contract --bundle /tmp/ckb-godot-naval/ckb_destory_naval_runtime.json --lock /tmp/ckb-godot-naval/ckb-naval-lock.json --output /tmp/ckb-naval-runtime-contract.json --fail-on-error
      - run: test -f /tmp/ckb-naval-runtime-contract.json
      - run: PYTHONPATH=src python -m ckb.godot_bundle --profile data/curated/destory/integrated_systems_build_profile.json --output /tmp/ckb-godot-integrated-systems --fail-on-error
      - run: PYTHONPATH=src python -m ckb.runtime_contract --bundle /tmp/ckb-godot-integrated-systems/ckb_destory_integrated_systems_runtime.json --lock /tmp/ckb-godot-integrated-systems/ckb-integrated-systems-lock.json --output /tmp/ckb-integrated-systems-runtime-contract.json --fail-on-error
      - run: test -f /tmp/ckb-integrated-systems-runtime-contract.json
      - run: PYTHONPATH=src python -m ckb.stability_gate --output /tmp/ckb-v2-stability.json --fail-on-error
      - run: test -f /tmp/ckb-v2-stability.json
      - run: PYTHONPATH=src python -m ckb.cli visualize --output /tmp/ckb-visualizations
      - run: test -f /tmp/ckb-visualizations/graph.json && test -f /tmp/ckb-visualizations/timeline.json && test -f /tmp/ckb-visualizations/map.json && test -f /tmp/ckb-visualizations/lineage.json && test -f /tmp/ckb-visualizations/battle_equipment.json && test -f /tmp/ckb-visualizations/industry_chain.json && test -f /tmp/ckb-visualizations/factory_location.json && test -f /tmp/ckb-visualizations/unit_organization.json
