name: Deploy CKB website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip "mkdocs-material>=9.5,<10"

      - name: Validate knowledge base
        run: PYTHONPATH=src python -m ckb.cli validate

      - name: Generate Chinese website source
        run: PYTHONPATH=src python -m ckb.cli site --output site_docs

      - name: Generate English website source
        run: PYTHONPATH=src python tools/build_english_site.py --output site_docs_en

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Chinese default site
        run: mkdocs build --strict --config-file mkdocs.yml --site-dir site

      - name: Build English site
        run: mkdocs build --strict --config-file mkdocs.en.yml --site-dir site/en

      - name: Verify bilingual output
        run: test -f site/index.html && test -f site/en/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
