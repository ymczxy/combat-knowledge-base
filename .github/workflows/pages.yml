name: Deploy CKB website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified bilingual source patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -d payload/bilingual ]; then
            cat payload/bilingual/part_* | base64 --decode > /tmp/ckb-bilingual.tar.gz
            echo "fe4e68ca78d20c57c5d54058e59f2f2ebccd8db25aa837640213a9be32f37fd9  /tmp/ckb-bilingual.tar.gz" | sha256sum --check
            tar -xzf /tmp/ckb-bilingual.tar.gz -C .
            rm -rf payload/bilingual .github/workflows/apply-bilingual.yml
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip "mkdocs-material>=9.5,<10"

      - name: Validate knowledge base and bilingual generator
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m ckb.cli validate
          PYTHONPATH=src python -m ckb.cli site --output site_docs
          test -f site_docs/zh/index.md
          test -f site_docs/en/index.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Chinese default site
        run: mkdocs build --strict --config-file mkdocs.yml --site-dir site

      - name: Build English site
        run: mkdocs build --strict --config-file mkdocs.en.yml --site-dir site/en

      - name: Verify bilingual output
        run: test -f site/index.html && test -f site/en/index.html

      - name: Persist bilingual source files
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Chinese-default bilingual CKB website [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
