name: Expand CKB bootstrap

on:
  push:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part_* | base64 --decode > /tmp/ckb.tar.gz
          tar -xzf /tmp/ckb.tar.gz -C .
          rm -rf payload .github/workflows/bootstrap.yml
      - name: Validate expanded project
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m ckb.cli validate
          PYTHONPATH=src python -m ckb.cli build --output /tmp/ckb-exports
      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bootstrap complete CKB engineering baseline"
          git push origin HEAD:main
