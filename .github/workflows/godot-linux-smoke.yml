name: Godot Linux Runtime Smoke

on:
  push:
    branches:
      - agent/godot-linux-runtime-smoke
  pull_request:
    # Run against stacked version PRs too; Godot consumption is a contract
    # for every version branch, not only the final default-branch merge.
  workflow_dispatch:

jobs:
  godot-linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Godot 4.7.1 Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*linux*x86_64*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          mv "$GODOT_BIN" /tmp/godot/godot
          /tmp/godot/godot --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1' /tmp/godot-version.txt

      - name: Build locked CKB runtime data
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ckb.godot_bundle \
            --profile data/curated/destory/build_profile.json \
            --output /tmp/ckb-godot \
            --fail-on-error
          PYTHONPATH=src python -m ckb.runtime_contract \
            --bundle /tmp/ckb-godot/ckb_destory_runtime.json \
            --lock /tmp/ckb-godot/ckb-lock.json \
            --output /tmp/ckb-runtime-contract.json \
            --fail-on-error
          PYTHONPATH=src python -m ckb.godot_bundle \
            --profile data/curated/destory/small_arms_build_profile.json \
            --output /tmp/ckb-godot-small-arms \
            --fail-on-error
          PYTHONPATH=src python -m ckb.runtime_contract \
            --bundle /tmp/ckb-godot-small-arms/ckb_destory_small_arms_runtime.json \
            --lock /tmp/ckb-godot-small-arms/ckb-small-arms-lock.json \
            --output /tmp/ckb-small-arms-runtime-contract.json \
            --fail-on-error

      - name: Prepare Godot smoke project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/godot_smoke/data examples/godot_smoke/artifacts
          cp examples/godot/CKBRuntimeBundle.gd examples/godot_smoke/CKBRuntimeBundle.gd
          cp examples/godot/CKBQuery.gd examples/godot_smoke/CKBQuery.gd
          cp /tmp/ckb-godot/ckb_destory_runtime.json examples/godot_smoke/data/
          cp /tmp/ckb-godot/ckb-lock.json examples/godot_smoke/data/
          cp /tmp/ckb-runtime-contract.json examples/godot_smoke/artifacts/python_runtime_contract.json
          cp /tmp/godot-version.txt examples/godot_smoke/artifacts/godot_version.txt
          mkdir -p examples/godot_smoke_small/data examples/godot_smoke_small/artifacts
          cp examples/godot/CKBRuntimeBundle.gd examples/godot_smoke_small/CKBRuntimeBundle.gd
          cp examples/godot/CKBQuery.gd examples/godot_smoke_small/CKBQuery.gd
          cp /tmp/ckb-godot-small-arms/ckb_destory_small_arms_runtime.json examples/godot_smoke_small/data/
          cp /tmp/ckb-godot-small-arms/ckb-small-arms-lock.json examples/godot_smoke_small/data/
          cp /tmp/ckb-small-arms-runtime-contract.json examples/godot_smoke_small/artifacts/python_runtime_contract.json
          cp /tmp/godot-version.txt examples/godot_smoke_small/artifacts/godot_version.txt

      - name: Run actual Godot Linux scene and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout 45s /tmp/godot/godot \
              --path examples/godot_smoke \
              --rendering-method gl_compatibility \
              --audio-driver Dummy \
              2>&1 | tee examples/godot_smoke/artifacts/godot_console.log
          grep -q 'CKB_GODOT_SMOKE_RESULT=PASS' examples/godot_smoke/artifacts/godot_console.log
          test -s examples/godot_smoke/artifacts/godot_runtime_smoke.png
          test -s examples/godot_smoke/artifacts/godot_runtime_smoke.json
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout 45s /tmp/godot/godot \
              --path examples/godot_smoke_small \
              --rendering-method gl_compatibility \
              --audio-driver Dummy \
              2>&1 | tee examples/godot_smoke_small/artifacts/godot_console.log
          grep -q 'CKB_GODOT_SMALL_ARMS_SMOKE_RESULT=PASS' examples/godot_smoke_small/artifacts/godot_console.log
          test -s examples/godot_smoke_small/artifacts/godot_small_arms_smoke.png
          test -s examples/godot_smoke_small/artifacts/godot_small_arms_smoke.json

      - name: Run integrated destory project harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/data godot/artifacts
          cp /tmp/ckb-godot/ckb_destory_runtime.json godot/data/ckb_destory_runtime.json
          cp /tmp/ckb-godot/ckb-lock.json godot/data/ckb-lock.json
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout 45s /tmp/godot/godot \
              --path godot \
              --rendering-method gl_compatibility \
              --audio-driver Dummy \
              2>&1 | tee godot/artifacts/destory_integration_console.log
          grep -q 'CKB_DESTORY_INTEGRATION_RESULT=PASS' godot/artifacts/destory_integration_console.log
          test -s godot/artifacts/destory_integration.json

      - name: Inspect screenshot
        shell: bash
        run: |
          set -euo pipefail
          file examples/godot_smoke/artifacts/godot_runtime_smoke.png | tee /tmp/screenshot-file.txt
          grep -q 'PNG image data, 1280 x 720' /tmp/screenshot-file.txt
          file examples/godot_smoke_small/artifacts/godot_small_arms_smoke.png | tee /tmp/small-arms-screenshot-file.txt
          grep -q 'PNG image data, 1280 x 720' /tmp/small-arms-screenshot-file.txt

      - name: Upload Godot Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-runtime-smoke
          if-no-files-found: warn
          retention-days: 14
          path: |
            examples/godot_smoke/artifacts/
            examples/godot_smoke/project.godot
            examples/godot_smoke/Smoke.gd
            examples/godot_smoke/Smoke.tscn
            examples/godot_smoke_small/artifacts/
            examples/godot_smoke_small/project.godot
            examples/godot_smoke_small/Smoke.gd
            examples/godot_smoke_small/Smoke.tscn
            godot/artifacts/
            godot/project.godot
            godot/DestoryIntegration.gd
            godot/DestoryIntegration.tscn
